<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Assistant</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      padding: 25px 18px;
      display: flex;
      flex-direction: column;
    }

    h1 {
      text-align: center;
      margin-top: 30px;
      font-size: 28px;
    }

    #status {
      text-align: center;
      color: #aaa;
      margin: 10px 0 25px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 10px 0;
    }

    .message {
      padding: 13px 16px;
      margin: 10px 0;
      border-radius: 15px;
      max-width: 85%;
      line-height: 1.4;
    }

    .user {
      background: #333;
      margin-left: auto;
    }

    .assistant {
      background: #1d5cff;
      margin-right: auto;
    }

    .mic {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: none;
      background: #1d5cff;
      color: white;
      font-size: 35px;
      margin: 20px auto;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(29,92,255,.5);
    }

    .mic:active {
      transform: scale(.95);
    }
  </style>
</head>

<body>

  <div class="app">

    <h1>🤖 My AI Assistant</h1>

    <div id="status">Tap 🎤 and speak</div>

    <div id="chat"></div>

    <button class="mic" onclick="startListening()">🎤</button>

  </div>

<script>

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();

  recognition.lang = "hi-IN";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = function() {
    document.getElementById("status").innerText =
      "🎧 सुन रहा हूँ...";
  };

  recognition.onresult = function(event) {

    const text = event.results[0][0].transcript;

    addMessage("You", text, "user");

    respond(text);
  };

  recognition.onerror = function() {
    document.getElementById("status").innerText =
      "❌ Mic permission check करो";
  };

  recognition.onend = function() {
    document.getElementById("status").innerText =
      "Tap 🎤 and speak";
  };

} else {

  alert("इस browser में voice recognition supported नहीं है.");
}


function startListening() {

  if (!recognition) return;

  recognition.start();
}


function addMessage(name, text, type) {

  const chat = document.getElementById("chat");

  const div = document.createElement("div");

  div.className = "message " + type;

  div.innerHTML = "<b>" + name + ":</b><br>" + text;

  chat.appendChild(div);

  chat.scrollTop = chat.scrollHeight;
}


function respond(text) {

  let answer = "";

  const lower = text.toLowerCase();


  if (
    lower.includes("hello") ||
    lower.includes("hi") ||
    lower.includes("हेलो") ||
    lower.includes("हाय")
  ) {

    answer = "Hello! 😎 मैं तुम्हारा AI assistant हूँ।";

  }

  else if (
    lower.includes("kaise ho") ||
    lower.includes("कैसे हो")
  ) {

    answer = "मैं बढ़िया हूँ 😎 तुम कैसे हो?";

  }

  else if (
    lower.includes("naam") ||
    lower.includes("नाम")
  ) {

    answer = "मेरा नाम My AI Assistant है।";

  }

  else if (
    lower.includes("thank") ||
    lower.includes("धन्यवाद")
  ) {

    answer = "You're welcome! ❤️";

  }

  else if (
    lower.includes("bye") ||
    lower.includes("बाय")
  ) {

    answer = "Bye! फिर बात करते हैं। 👋";

  }

  else {

    answer =
      "मैंने सुना: " +
      text +
      ". अभी मैं basic mode में हूँ। बाद में हम इसमें असली AI जोड़ेंगे। 🤖";
  }


  addMessage("Assistant", answer, "assistant");

  speak(answer);
}


function speak(text) {

  const speech = new SpeechSynthesisUtterance(text);

  speech.lang = "hi-IN";
  speech.rate = 1;
  speech.pitch = 1;

  window.speechSynthesis.cancel();

  window.speechSynthesis.speak(speech);
}

</script>

</body>
</html>
