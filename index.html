<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Assistant</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      padding: 25px 18px;
      display: flex;
      flex-direction: column;
    }

    h1 {
      text-align: center;
      margin-top: 30px;
      font-size: 28px;
    }

    #status {
      text-align: center;
      color: #aaa;
      margin: 10px 0 25px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 10px 0;
    }

    .message {
      padding: 13px 16px;
      margin: 10px 0;
      border-radius: 15px;
      max-width: 85%;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .user {
      background: #333;
      margin-left: auto;
    }

    .assistant {
      background: #1d5cff;
      margin-right: auto;
    }

    .mic {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: none;
      background: #1d5cff;
      color: white;
      font-size: 35px;
      margin: 20px auto;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(29,92,255,.5);
    }

    .mic:active {
      transform: scale(.95);
    }
  </style>
</head>

<body>

  <div class="app">

    <h1>🤖 My AI Assistant</h1>

    <div id="status">Tap 🎤 and speak</div>

    <div id="chat"></div>

    <button class="mic" onclick="startListening()">🎤</button>

  </div>

<script>

const BACKEND_URL =
  "https://script.google.com/macros/s/AKfycbyC4l6Y_Kapy90VtWeqI-qa35HtrC6VWU0o4zTfvY8CJh7fxQSefTuUiJ8YnSM9HJ0S/exec";


const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition;


if (SpeechRecognition) {

  recognition = new SpeechRecognition();

  recognition.lang = "hi-IN";
  recognition.continuous = false;
  recognition.interimResults = false;


  recognition.onstart = function() {

    document.getElementById("status").innerText =
      "🎧 सुन रहा हूँ...";

  };


  recognition.onresult = function(event) {

    const text =
      event.results[0][0].transcript;

    addMessage("You", text, "user");

    askAI(text);

  };


  recognition.onerror = function(event) {

    console.log("Mic error:", event.error);

    document.getElementById("status").innerText =
      "❌ Mic permission check करो";

  };


  recognition.onend = function() {

    document.getElementById("status").innerText =
      "Tap 🎤 and speak";

  };

} else {

  alert(
    "इस browser में voice recognition supported नहीं है."
  );

}



function startListening() {

  if (!recognition) return;

  try {

    recognition.start();

  } catch (error) {

    console.log(error);

  }

}



function addMessage(name, text, type) {

  const chat =
    document.getElementById("chat");

  const div =
    document.createElement("div");

  div.className =
    "message " + type;

  div.innerHTML =
    "<b>" +
    name +
    ":</b><br>" +
    escapeHTML(text);

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;

}



function escapeHTML(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}



async function askAI(text) {

  const status =
    document.getElementById("status");

  status.innerText =
    "🤖 AI सोच रहा है...";


  try {

    const response =
      await fetch(BACKEND_URL, {

        method: "POST",

        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },

        body: JSON.stringify({
          message: text
        })

      });


    const data =
      await response.json();


    if (data.error) {

      throw new Error(data.error);

    }


    const answer =
      data.reply;


    addMessage(
      "Assistant",
      answer,
      "assistant"
    );


    speak(answer);


    status.innerText =
      "Tap 🎤 and speak";


  } catch (error) {

    console.error(error);

    const errorMessage =
      "Sorry 😔 AI से connection नहीं हो पाया।";

    addMessage(
      "Assistant",
      errorMessage,
      "assistant"
    );

    speak(errorMessage);

    status.innerText =
      "❌ Connection error";

  }

}



function speak(text) {

  const speech =
    new SpeechSynthesisUtterance(text);

  speech.lang =
    "hi-IN";

  speech.rate =
    1;

  speech.pitch =
    1;

  window.speechSynthesis.cancel();

  window.speechSynthesis.speak(speech);

}

</script>

</body>
</html>
